resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        slowCallRateThreshold: 50
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

    instances:
      weatherApi:
        baseConfig: default
        waitDurationInOpenState: 60s
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
      marketDataCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 120s
        failureRateThreshold: 60
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - tech.agrowerk.infrastructure.exception.local.MarketDataException

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

    instances:
      weatherApi:
        baseConfig: default
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
      marketDataRetry:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 3s
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

  ratelimiter:
    instances:
      weatherApi:
        limitForPeriod: 100
        limitRefreshPeriod: 1m
        timeoutDuration: 0s
      marketDataRateLimiter:
        limitForPeriod: 1
        limitRefreshPeriod: 15s
        timeoutDuration: 120s

  timelimiter:
    instances:
      weatherApiCircuitBreaker:
        timeoutDuration: 12s
      marketDataCircuitBreaker:
        timeoutDuration: 30s

  bulkhead:
    instances:
      weatherApi:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms
      marketDataBulkhead:
        maxConcurrentCalls: 3
        maxWaitDuration: 500ms

management:
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        resilience4j.circuitbreaker.calls: true